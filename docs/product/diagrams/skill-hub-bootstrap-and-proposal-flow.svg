<svg viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" font-size="26" font-weight="700" fill="#111827">ManagedSkillHub — Bootstrap, Consumption &amp; Proposal Lifecycle</text>
  <text x="40" y="66" font-size="15" fill="#6b7280">General reference for any agent or human onboarding to a ManagedSkillHub registry</text>

  <!-- Starter prompt box -->
  <rect x="40" y="86" width="1480" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="108" font-size="13" font-weight="700" fill="#3730a3">Example starter prompt (any agent/runtime):</text>
  <text x="58" y="130" font-size="13" font-family="Menlo, Consolas, monospace" fill="#312e81">Set up the skill hub locally via curl at https://your-registry.example.com and install the bootstrap skill globally and persistently (no remote sandbox).</text>

  <!-- Row 1: 4 boxes, blue = agent read path, box4 amber = write path -->
  <!-- Box 1 -->
  <rect x="40" y="180" width="340" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="208" font-size="15" font-weight="700" fill="#1e3a8a">1 · Bootstrap</text>
  <text x="56" y="232" font-size="12" fill="#1e3a8a">curl GET /discover</text>
  <text x="56" y="249" font-size="12" fill="#1e3a8a">→ bootstrapSkill: use-skill-hub</text>
  <text x="56" y="266" font-size="12" fill="#1e3a8a">install globally &amp; persistently</text>
  <text x="56" y="283" font-size="12" fill="#1e3a8a">(no project folder, no remote sandbox)</text>

  <!-- Box 2 -->
  <rect x="420" y="180" width="340" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="436" y="208" font-size="15" font-weight="700" fill="#1e3a8a">2 · Discover &amp; Download</text>
  <text x="436" y="232" font-size="12" fill="#1e3a8a">via use-skill-hub:</text>
  <text x="436" y="249" font-size="12" fill="#1e3a8a">/skills/search → resolved skillId</text>
  <text x="436" y="266" font-size="12" fill="#1e3a8a">GET .../package</text>
  <text x="436" y="283" font-size="12" fill="#1e3a8a">→ ZIP + skill-hub-meta.json</text>

  <!-- Box 3 -->
  <rect x="800" y="180" width="340" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="816" y="208" font-size="15" font-weight="700" fill="#1e3a8a">3 · Customize &amp; Use</text>
  <text x="816" y="232" font-size="12" fill="#1e3a8a">adjust skill-specific config</text>
  <text x="816" y="249" font-size="12" fill="#1e3a8a">(repos, output paths, etc. —</text>
  <text x="816" y="266" font-size="12" fill="#1e3a8a">depends on the skill)</text>
  <text x="816" y="283" font-size="12" fill="#1e3a8a">run it against a real task</text>

  <!-- Box 4 (write path, amber) -->
  <rect x="1180" y="180" width="340" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1196" y="208" font-size="15" font-weight="700" fill="#78350f">4 · Propose Change Back</text>
  <text x="1196" y="232" font-size="12" fill="#78350f">remove skill-hub-meta.json</text>
  <text x="1196" y="249" font-size="12" fill="#78350f">GET /howToPropose</text>
  <text x="1196" y="266" font-size="12" fill="#78350f">→ preflight + duplicate check</text>
  <text x="1196" y="283" font-size="12" fill="#78350f">POST /proposals → validate → finalize</text>

  <!-- Arrows row 1 -->
  <path d="M380,255 L416,255" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M760,255 L796,255" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1140,255 L1176,255" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Branch from box4 down to judger/admin -->
  <path d="M1350,330 L1350,405 L730,405 L730,426" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1350,330 L1350,405 L1190,405 L1190,426" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="1000" y="398" font-size="11" fill="#6b7280" text-anchor="middle">judger configured? / green?</text>

  <!-- Row 2: judger (purple, optional/pluggable) + admin (amber) -->
  <rect x="560" y="430" width="340" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="576" y="458" font-size="15" font-weight="700" fill="#4c1d95">5a · Automated Judger</text>
  <text x="576" y="476" font-size="11" font-weight="700" fill="#6d28d9">(optional, pluggable adapter)</text>
  <text x="576" y="497" font-size="12" fill="#4c1d95">configured JUDGER_PROVIDER</text>
  <text x="576" y="514" font-size="12" fill="#4c1d95">scores proposal risk</text>
  <text x="576" y="531" font-size="12" fill="#4c1d95">AUTO_PUBLISH_ON_GREEN=true</text>
  <text x="576" y="548" font-size="12" fill="#4c1d95">→ eligible proposals auto-publish</text>

  <rect x="1020" y="430" width="340" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1036" y="458" font-size="15" font-weight="700" fill="#78350f">5b · Admin Review (manual)</text>
  <text x="1036" y="480" font-size="12" fill="#78350f">convert proposal → draft version</text>
  <text x="1036" y="497" font-size="12" fill="#78350f">approve / reject / deprecate</text>
  <text x="1036" y="514" font-size="12" fill="#78350f">required when: no judge configured,</text>
  <text x="1036" y="531" font-size="12" fill="#78350f">not green, or reserved/system-managed</text>
  <text x="1036" y="548" font-size="12" fill="#78350f">(always true for use-skill-hub itself)</text>

  <!-- Down to published -->
  <path d="M730,580 L730,676" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1190,580 L1190,676" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 3: published (green) -->
  <rect x="560" y="680" width="720" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="920" y="708" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">6 · Published Skill Version</text>
  <text x="920" y="730" font-size="12" fill="#14532d" text-anchor="middle">visible again via /skills, /skills/search, /skills/:id/manifest, /skills/:id/package</text>
  <text x="920" y="748" font-size="12" fill="#14532d" text-anchor="middle">→ the next user / agent discovers it immediately through use-skill-hub</text>

  <!-- Feedback loop back to step 2 (routed through the empty band above row 1, clear of every box) -->
  <path d="M1280,735 L1560,735 L1560,162 L590,162 L590,176" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowGray)"/>
  <text x="1075" y="155" font-size="11" fill="#6b7280" text-anchor="middle">discoverable again next time</text>

  <!-- Legend -->
  <rect x="40" y="830" width="18" height="18" fill="#dbeafe" stroke="#2563eb"/>
  <text x="66" y="844" font-size="12" fill="#111827">Agent read path (steps 1–3)</text>

  <rect x="420" y="830" width="18" height="18" fill="#fef3c7" stroke="#b45309"/>
  <text x="446" y="844" font-size="12" fill="#111827">Write / propose path (step 4, admin review)</text>

  <rect x="900" y="830" width="18" height="18" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="926" y="844" font-size="12" fill="#111827">Optional automated judger — only present if you configure one</text>

  <rect x="40" y="860" width="18" height="18" fill="#dcfce7" stroke="#15803d"/>
  <text x="66" y="874" font-size="12" fill="#111827">Published outcome</text>

  <!-- Footnote -->
  <text x="40" y="910" font-size="11" fill="#9ca3af">Sources: docs/roadmap/EPIC-013-use-skill-hub-bootstrap-and-download-metadata.md, docs/product/AGENT_BOOTSTRAP.md, docs/setup/JUDGER_ADAPTERS.md.</text>
</svg>
